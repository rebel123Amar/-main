<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebel Gifts — Client Design Showcase (Review Pages)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Showcase Bar */
    .showcase-header {
      background: #111827;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .showcase-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .showcase-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .showcase-badge {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #f43f5e;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Tabs list */
    .showcase-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .tab-btn.is-active {
      background: #f43f5e;
      border-color: #f43f5e;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4);
    }

    /* Device Toggles & Actions */
    .showcase-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .device-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 3px;
    }

    .dev-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .dev-btn.is-active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .open-ext-btn {
      background: #ffffff;
      color: #0f172a;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s;
    }

    .open-ext-btn:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    /* Main Preview Stage */
    .preview-stage {
      flex: 1;
      background: #060911;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }

    /* Device Frame Wrappers */
    .frame-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .device-mobile {
      width: 412px;
      height: 840px;
      max-height: 94%;
      border-radius: 44px;
      border: 10px solid #1e293b;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    .device-tablet {
      width: 768px;
      height: 900px;
      max-height: 94%;
      border-radius: 28px;
      border: 10px solid #1e293b;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    .device-desktop {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Bottom Info Ribbon */
    .showcase-footer {
      background: #111827;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Top Showcase Toolbar -->
  <header class="showcase-header">
    <div class="showcase-brand">
      <div class="showcase-logo">
        <span>🎁</span>
        <span>Rebel Gifts</span>
      </div>
      <div class="showcase-badge">Client Presentation Hub</div>
    </div>

    <!-- Design Selector Tabs -->
    <div class="showcase-tabs">
      <button class="tab-btn is-active" data-src="review-page-preview.html">
        <span>🌸</span>
        <span>Original: Romantic Rose</span>
      </button>
      <button class="tab-btn" data-src="review-page-preview-1-luxury-midnight.html">
        <span>✦</span>
        <span>Option 1: Midnight Luxury & Gold</span>
      </button>
      <button class="tab-btn" data-src="review-page-preview-2-minimal-editorial.html">
        <span>●</span>
        <span>Option 2: Minimal Editorial Studio</span>
      </button>
      <button class="tab-btn" data-src="review-page-preview-3-interactive-story.html">
        <span>🎉</span>
        <span>Option 3: Interactive Multi-Step & Reward</span>
      </button>
      <button class="tab-btn" data-src="review-page-preview-4-ugc-social.html">
        <span>📸</span>
        <span>Option 4: UGC Social Proof & Wall</span>
      </button>
    </div>

    <!-- Device Sizing & Fullscreen -->
    <div class="showcase-actions">
      <div class="device-switcher">
        <button class="dev-btn is-active" id="btn-mobile" title="Mobile iPhone View">📱 Mobile</button>
        <button class="dev-btn" id="btn-tablet" title="Tablet View">💻 Tablet</button>
        <button class="dev-btn" id="btn-desktop" title="Full Desktop View">🖥️ Full</button>
      </div>
      <a href="review-page-preview.html" target="_blank" class="open-ext-btn" id="open-new-tab">
        <span>Open Direct ↗</span>
      </a>
    </div>
  </header>

  <!-- Live Device Stage -->
  <main class="preview-stage">
    <div class="frame-container">
      <div class="device-mobile" id="device-wrapper">
        <iframe id="preview-frame" src="review-page-preview.html"></iframe>
      </div>
    </div>
  </main>

  <!-- Footer status -->
  <footer class="showcase-footer">
    <div id="design-description">
      🌸 <b>Current View:</b> Romantic Rose Soft Glow — Original Signature Rebel Design
    </div>
    <div>
      💡 <i>Tip: Switch between Mobile & Desktop frames to test customer experience</i>
    </div>
  </footer>

  <script>
    const tabs = document.querySelectorAll('.tab-btn');
    const iframe = document.getElementById('preview-frame');
    const openBtn = document.getElementById('open-new-tab');
    const devWrapper = document.getElementById('device-wrapper');
    const desc = document.getElementById('design-description');

    const descriptions = {
      'review-page-preview.html': '🌸 <b>Design 1 (Original):</b> Romantic Rose Soft Card — Signature cute pastel pink with soft glow',
      'review-page-preview-1-luxury-midnight.html': '✦ <b>Option 1:</b> Midnight Luxury & Gold Dark Mode — High-end atelier glassmorphism with VIP 15% reward certificate',
      'review-page-preview-2-minimal-editorial.html': '● <b>Option 2:</b> Minimal Editorial Studio — Apple/Notion inspired clean typography, segmented ratings & tag chips',
      'review-page-preview-3-interactive-story.html': '🎉 <b>Option 3:</b> Interactive Multi-Step Story — Gamified 3-step conversational flow with confetti & scratch ₹150 coupon',
      'review-page-preview-4-ugc-social.html': '📸 <b>Option 4:</b> UGC Social Proof & Wall of Love — Visual-first with live customer photo reel, verified badge & Instagram hamper prompt'
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('is-active'));
        tab.classList.add('is-active');
        const src = tab.dataset.src;
        iframe.src = src;
        openBtn.href = src;
        desc.innerHTML = descriptions[src] || '';
      });
    });

    // Device switches
    const btnMobile = document.getElementById('btn-mobile');
    const btnTablet = document.getElementById('btn-tablet');
    const btnDesktop = document.getElementById('btn-desktop');

    btnMobile.addEventListener('click', () => {
      [btnMobile, btnTablet, btnDesktop].forEach(b => b.classList.remove('is-active'));
      btnMobile.classList.add('is-active');
      devWrapper.className = 'device-mobile';
    });

    btnTablet.addEventListener('click', () => {
      [btnMobile, btnTablet, btnDesktop].forEach(b => b.classList.remove('is-active'));
      btnTablet.classList.add('is-active');
      devWrapper.className = 'device-tablet';
    });

    btnDesktop.addEventListener('click', () => {
      [btnMobile, btnTablet, btnDesktop].forEach(b => b.classList.remove('is-active'));
      btnDesktop.classList.add('is-active');
      devWrapper.className = 'device-desktop';
    });
  </script>
</body>
</html>
